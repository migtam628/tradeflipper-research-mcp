name: MCP offline tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pandas>=2.2,<4' 'pytest>=8,<10'
      - run: python -m pytest -q mcp_server/tests
      - run: python -m compileall -q mcp_server
